name: split-dart-sdk
repository: https://github.com/Harness_Split/dart-client

packages:
  - packages/**

scripts:
  test:
    run: melos exec --concurrency=4 -- dart test
    description: Run all package tests

  analyze:
    run: melos exec -- dart analyze
    description: Analyze all packages

  format:
    run: melos exec -- dart format .
    description: Format all packages

  publish:
    run: melos publish
    description: Publish packages to pub.dev
