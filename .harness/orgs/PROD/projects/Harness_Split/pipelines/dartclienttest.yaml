pipeline:
  name: dart-client-test
  identifier: dartclienttest
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: dart-client
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_dependencies
                  spec:
                    connectorRef: dockerhub
                    image: dart:stable
                    shell: Sh
                    command: |
                      set -eu
                      dart pub get
                      dart run melos bootstrap
              - step:
                  type: Run
                  name: Analyze
                  identifier: analyze
                  spec:
                    connectorRef: dockerhub
                    image: dart:stable
                    shell: Sh
                    command: |
                      set -eu
                      dart pub get
                      dart run melos run analyze
              - step:
                  type: Run
                  name: Run Tests
                  identifier: run_tests
                  spec:
                    connectorRef: dockerhub
                    image: dart:stable
                    shell: Sh
                    command: |
                      set -eu
                      dart pub get
                      dart run melos run test
              - step:
                  type: Run
                  name: Generate Coverage Report
                  identifier: generate_coverage_report
                  spec:
                    connectorRef: dockerhub
                    image: dart:stable
                    shell: Sh
                    command: |
                      set -eu
                      dart pub get
                      dart run melos run collect-coverage

                      echo "Coverage report:"
                      ls -la coverage/lcov.info || true
                  when:
                    stageStatus: Success
              - step:
                  type: Run
                  name: Install and Run SonarQube Scanner
                  identifier: install_sonarqube_scanner
                  spec:
                    connectorRef: account.harnessImage
                    image: sonarsource/sonar-scanner-cli
                    shell: Bash
                    command: |
                      set -euo pipefail

                      if [ -d "/harness/<+codebase.repoName>" ]; then
                        cd "/harness/<+codebase.repoName>"
                      fi

                      COMMON_ARGS="
                        -Dsonar.host.url=https://sonar.harness.io
                        -Dsonar.projectKey=dart-client
                        -Dsonar.token=$SONAR_TOKEN
                        -Dsonar.scanner.skipSystemTruststore=true
                        -Dsonar.sources=packages
                        -Dsonar.tests=packages
                        -Dsonar.test.inclusions=packages/**/test/**/*_test.dart
                        -Dsonar.exclusions=**/build/**,packages/e2e/**
                        -Dsonar.coverage.exclusions=**/*_test.dart
                        -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
                      "

                      if [ "<+codebase.prNumber>" != "" ] && [ "<+codebase.prNumber>" != "null" ]; then
                        echo "Pull Request Analysis"
                        sonar-scanner \
                          $COMMON_ARGS \
                          -Dsonar.pullrequest.key=<+codebase.prNumber> \
                          -Dsonar.pullrequest.branch=<+codebase.sourceBranch> \
                          -Dsonar.pullrequest.base=<+codebase.targetBranch>
                      else
                        echo "Branch Analysis"
                        sonar-scanner \
                          $COMMON_ARGS \
                          -Dsonar.branch.name=<+codebase.branch>
                      fi
                    envVariables:
                      SONAR_TOKEN: <+secrets.getValue("sonarqube-token")>
                  timeout: 10m
                  when:
                    stageStatus: Success
