pipeline:
  name: dart-client-test
  identifier: dartclienttest
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: dart-client
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build Analyze Test and Coverage
                  identifier: build_analyze_test_coverage
                  spec:
                    connectorRef: dockerhub
                    image: dart:stable
                    shell: Sh
                    command: |
                      set -eu
                      dart pub get
                      dart run melos bootstrap
                      dart run melos run analyze
                      dart run melos run test
                      dart run melos run collect-coverage
              - step:
                  type: Run
                  name: Install and Run SonarQube Scanner
                  identifier: install_sonarqube_scanner
                  spec:
                    connectorRef: account.harnessImage
                    image: sonarsource/sonar-scanner-cli
                    shell: Bash
                    command: |
                      set -euo pipefail

                      if [ -d "/harness/<+codebase.repoName>" ]; then
                        cd "/harness/<+codebase.repoName>"
                      fi

                      echo "PWD: $(pwd)"
                      echo "Coverage file:"
                      ls -la coverage/lcov.info || echo "NOT FOUND"
                      wc -l coverage/lcov.info || true

                      SONAR_COMMON="-Dsonar.host.url=https://sonar.harness.io -Dsonar.token=$SONAR_TOKEN -Dsonar.scanner.skipSystemTruststore=true"

                      if [ "<+codebase.prNumber>" != "" ] && [ "<+codebase.prNumber>" != "null" ]; then
                        echo "Pull Request Analysis"
                        sonar-scanner $SONAR_COMMON \
                          -Dsonar.pullrequest.key=<+codebase.prNumber> \
                          -Dsonar.pullrequest.branch=<+codebase.sourceBranch> \
                          -Dsonar.pullrequest.base=<+codebase.targetBranch>
                      else
                        echo "Branch Analysis"
                        sonar-scanner $SONAR_COMMON \
                          -Dsonar.branch.name=<+codebase.branch>
                      fi
                    envVariables:
                      SONAR_TOKEN: <+secrets.getValue("sonarqube-token")>
                  timeout: 10m
                  when:
                    stageStatus: Success
