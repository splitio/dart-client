name: local
description: Binds engine and storage for LOCAL evaluation. Implements Evaluator port and EvaluationContext over stores. Central place for store lookups, recursive evaluation, and segment membership dispatch.
version: 0.0.1

environment:
  sdk: ^3.0.0

dependencies:
  engine:
    path: ../engine
  storage:
    path: ../storage
  parsing:
    path: ../parsing
  models:
    path: ../models

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
