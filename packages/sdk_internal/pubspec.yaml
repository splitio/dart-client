version: 0.0.1

environment:
  sdk: ^3.0.0
publish_to: none

dependencies:
  models:
    path: ../models
  engine:
    path: ../engine
  storage:
    path: ../storage
  parsing:
    path: ../parsing
  local:
    path: ../local
  client:
    path: ../client
  sync:
    path: ../sync
  recorders:
    path: ../recorders
  http_client:
    path: ../http_client
  auth:
    path: ../auth
  observer:
    path: ../observer
  events:
    path: ../events
  logger:
    path: ../logger

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
